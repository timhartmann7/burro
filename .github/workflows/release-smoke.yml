name: release-smoke

# Installs a published release through every channel on clean runners.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  signatures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: S4-02 cosign and the attestation verify checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R timhartmann7/burro -p checksums.txt -p checksums.txt.sigstore.json
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/timhartmann7/burro/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify checksums.txt -R timhartmann7/burro

  script:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: S4-03 install.sh installs without sudo and the version matches the tag
        run: |
          curl -fsSL https://github.com/timhartmann7/burro/releases/latest/download/install.sh | BURRO_VERSION="$TAG" sh
          out=$(~/.local/bin/burro --version)
          echo "$out"
          case $out in "burro ${TAG#v} "*" (script)") ;; *) exit 1 ;; esac

  brew:
    runs-on: macos-latest
    steps:
      - name: S4-05 brew installs a binary without quarantine that prints its version
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install timhartmann7/tap/burro
          bin="$(brew --prefix)/Caskroom/burro/${TAG#v}/burro"
          if xattr -p com.apple.quarantine "$bin" 2>/dev/null; then
            echo "quarantine attribute is set on $bin"
            exit 1
          fi
          out=$(burro --version)
          echo "$out"
          case $out in "burro ${TAG#v} darwin/"*" (brew)") ;; *) exit 1 ;; esac

  go-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The test server of the integration tests stands in for the user's.
      - name: Start a server
        run: |
          install -d -m 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/smoke
          image=$(docker build --quiet test/sshd)
          docker run --detach --name smoke --publish 127.0.0.1:2222:22 \
            --env AUTHORIZED_KEY="$(cat ~/.ssh/smoke.pub)" "$image"
          for _ in $(seq 30); do
            ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1 && break
            sleep 1
          done
          # The host key comes from the container itself, not the network.
          echo "[127.0.0.1]:2222 $(docker exec smoke cat /etc/ssh/ssh_host_ed25519_key.pub)" >>~/.ssh/known_hosts
      - name: S4-06 a go install client installs a server binary from Releases
        working-directory: ${{ runner.temp }}
        run: |
          go install "github.com/timhartmann7/burro/cmd/burro@$TAG"
          burro="$(go env GOPATH)/bin/burro"
          "$burro" --version | grep -qx "burro ${TAG#v} linux/amd64 (go)"
          "$burro" host add smoke burro@127.0.0.1:2222 -i ~/.ssh/smoke
          test "$(docker exec -u burro smoke /home/burro/.burro/bin/burro --version)" = "burro ${TAG#v} linux/amd64 (script)"
