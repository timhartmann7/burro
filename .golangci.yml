version: "2"

run:
  modules-download-mode: readonly
  # Integration tests live behind a build tag and must be linted too.
  build-tags: [integration]

linters:
  default: standard
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - depguard
    - dupl
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - godox
    - gosec
    - gosmopolitan
    - misspell
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - revive
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    depguard:
      rules:
        module:
          files: ["$all"]
          allow:
            - $gostd
            - github.com/BurntSushi/toml
            - github.com/timhartmann7/burro
        toml-only-in-config:
          files: ["$all", "!**/internal/config/**"]
          deny:
            - pkg: github.com/BurntSushi/toml
              desc: only internal/config parses TOML
        # Import layers from docs/architecture.md: imports point down only.
        # Tests sit above every layer, since they may import internal/testutil.
        layer-0:
          files: ["**/internal/output/**", "**/internal/mode/**", "!$test"]
          deny:
            - pkg: github.com/timhartmann7/burro/internal
              desc: layer 0 imports only the standard library
        layer-1:
          files:
            - "**/internal/config/**"
            - "**/internal/hosts/**"
            - "**/internal/tree/**"
            - "**/internal/report/**"
            - "**/internal/serverbin/**"
            - "**/internal/update/**"
            - "**/internal/initcmd/**"
            - "!$test"
          deny:
            - pkg: github.com/timhartmann7/burro/internal/config
              desc: layer 1 imports only layer 0
            - pkg: github.com/timhartmann7/burro/internal/hosts
              desc: layer 1 imports only layer 0
            - pkg: github.com/timhartmann7/burro/internal/tree
              desc: layer 1 imports only layer 0
            - pkg: github.com/timhartmann7/burro/internal/report
              desc: layer 1 imports only layer 0
            - pkg: github.com/timhartmann7/burro/internal/serverbin
              desc: layer 1 imports only layer 0
            - pkg: github.com/timhartmann7/burro/internal/update
              desc: layer 1 imports only layer 0
            - pkg: github.com/timhartmann7/burro/internal/initcmd
              desc: layer 1 imports only layer 0
            - pkg: github.com/timhartmann7/burro/internal/agent
              desc: layer 1 imports only layer 0
            - pkg: github.com/timhartmann7/burro/internal/runner
              desc: layer 1 imports only layer 0
            - pkg: github.com/timhartmann7/burro/internal/cli
              desc: layer 1 imports only layer 0
        layer-2:
          files: ["**/internal/agent/**", "**/internal/runner/**", "!$test"]
          deny:
            - pkg: github.com/timhartmann7/burro/internal/agent
              desc: layer 2 imports only layers 0 and 1
            - pkg: github.com/timhartmann7/burro/internal/runner
              desc: layer 2 imports only layers 0 and 1
            - pkg: github.com/timhartmann7/burro/internal/cli
              desc: layer 2 imports only layers 0 and 1
        layer-3:
          files: ["**/internal/cli/**", "!$test"]
          deny:
            - pkg: github.com/timhartmann7/burro/cmd
              desc: layer 3 imports only the layers below it
        layer-4:
          files: ["**/cmd/burro/**", "!$test"]
          allow:
            - $gostd
            - github.com/timhartmann7/burro/internal/cli
            - github.com/timhartmann7/burro/internal/output
        testutil-only-in-tests:
          files: ["$all", "!$test"]
          deny:
            - pkg: github.com/timhartmann7/burro/internal/testutil
              desc: only _test.go files import internal/testutil
    dupl:
      threshold: 100
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 5
    goconst:
      min-occurrences: 3
    godox:
      keywords: [TODO, FIXME, HACK, XXX]
    gosmopolitan:
      watch-for-scripts: [Cyrillic]
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
    gocritic:
      enabled-tags: [diagnostic, style, performance, experimental]
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print
          msg: write to the injected io.Writer
        - pattern: ^os\.(Exit|Stdin|Stdout|Stderr)$
          msg: only cmd/burro touches process I/O and the exit status
        - pattern: ^log\.
          msg: return errors instead of logging
        - pattern: ^panic$
          msg: return an error
        - pattern: ^time\.Sleep$
          msg: wait on a context, a ticker or a condition
  exclusions:
    rules:
      - path: ^cmd/burro/
        linters: [forbidigo]
      # The test harness exists to run docker, ssh and the built binary and to
      # read the files it generated, so variable commands and paths are its job.
      - path: (^internal/testutil/|_test\.go$)
        linters: [gosec]
        text: "^G(204|304|702):"

formatters:
  enable: [gofumpt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/timhartmann7/burro]
